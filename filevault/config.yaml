name: FileVault
version: "0.1.0-alpha.9"
slug: filevault
breaking_versions:
  - "0.1.0-alpha.3"
description: One Mac profile for password SSH and optional Tailscale running checks
url: https://github.com/jessfraz/ha-filevault
arch:
  - amd64
  - aarch64
image: ghcr.io/jessfraz/ha-filevault
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:safe-square-outline
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Optional bearer-authenticated read-only status API; no host port by default
environment:
  FILEVAULT_ENABLE_INGRESS: "true"
options:
  auto_pairing: true
  allowed_user_ids: []
  frontend_origin: ""
  status_token: ""
  mac:
    host: ""
    tailscale_host: ""
    port: 22
    username: ""
    manual_enabled: true
  automatic:
    enabled: false
    preboot_public_key: ""
    runtime_public_key: ""
    manual_enrollment_verified: false
schema:
  auto_pairing: bool
  allowed_user_ids:
    - str
  frontend_origin: str
  status_token: password
  mac:
    host: str
    tailscale_host: str
    port: port
    username: str
    manual_enabled: bool
  automatic:
    enabled: bool
    preboot_public_key: str
    runtime_public_key: str
    manual_enrollment_verified: bool
discovery:
  - filevault
