[package]
name = "filevault"
version = "0.1.7"
edition = "2024"
license = "MIT"
description = "FileVault recovery status for Home Assistant"

[workspace]
members = ["cli"]
default-members = ["."]
resolver = "3"

[dependencies]
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.2" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.18"
getrandom = "0.4"
http = "1"
schemars = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
# Temporary upstream pin until a registry release permits the SQLite advisory fix.
sqlx = { version = "0.9", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
zeroize = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"

[dev-dependencies]
rand = "0.10"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
