[package]
name = "filevault"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "FileVault recovery status for Home Assistant"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dropshot = "0.17"
getrandom = "0.4"
http = "1"
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slog = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
zeroize = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"

[dev-dependencies]
rand = "0.10"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
