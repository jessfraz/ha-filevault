[project]
name = "filevault-home-assistant"
version = "0.1.5"
description = "Read-only Home Assistant adapter for FileVault status"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant==2026.11.0",
  "aiohasupervisor==0.9.0",
  "ruff==0.17.3",
  "ty==0.0.97",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_ha"]
addopts = "--strict-markers -p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.per-file-target-version]
"scripts/*" = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.uv]
package = false
