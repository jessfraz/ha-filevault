name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all --benches --tests --examples --all-features -- -D warnings
      - run: cargo test --locked --all-features
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check custom_components tests_ha
      - run: uv run --frozen ruff format --check custom_components tests_ha
      - run: uv run --frozen ty check --project . --python .venv --python-version 3.14 --error-on-warning custom_components tests_ha
      - run: uv run --frozen pytest tests_ha
  public-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-public-tree
      - run: scripts/check-release-version
      - run: bash -n scripts/container-smoke.sh
      - run: sh -n docker-entrypoint.sh
      - run: node --check web/app.js
      - run: node tests_web/policy.mjs
      - run: node tests_web/recovery.mjs
      - run: node tests_web/app.mjs
